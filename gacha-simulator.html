<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gacha Simulator</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --bg: #f5f6fa;
    --surface: #ffffff;
    --text: #1f2330;
    --text-muted: #6b7280;
    --border: #e2e4ea;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: var(--primary);
    color: #fff;
    padding: 24px 16px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 8px 0;
    font-size: 1.8rem;
  }

  header p {
    margin: 0;
    color: #e0e7ff;
    font-size: 0.95rem;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  section h2 {
    margin-top: 0;
    font-size: 1.2rem;
    color: var(--primary-dark);
  }

  .placeholder {
    color: var(--text-muted);
    font-style: italic;
    font-size: 0.9rem;
  }

  .rate-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  .rate-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .rate-field label {
    font-weight: 600;
    font-size: 0.9rem;
  }

  .rate-input-wrap {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .rate-input-wrap input {
    width: 80px;
    border: none;
    padding: 8px;
    font-size: 1rem;
    outline: none;
  }

  .rate-input-wrap .unit {
    padding: 0 10px;
    background: var(--bg);
    color: var(--text-muted);
    border-left: 1px solid var(--border);
  }

  .rate-total {
    margin-top: 12px;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .rate-total.valid {
    color: #16a34a;
  }

  .rate-total.invalid {
    color: #dc2626;
  }

  .item-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .item-form input,
  .item-form select {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
  }

  .item-form input {
    flex: 1;
    min-width: 160px;
  }

  .item-form button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }

  .item-form button:hover {
    background: var(--primary-dark);
  }

  .form-error {
    color: #dc2626;
    font-size: 0.85rem;
    min-height: 1.2em;
    margin-bottom: 8px;
  }

  .item-table {
    width: 100%;
    border-collapse: collapse;
  }

  .item-table th,
  .item-table td {
    text-align: left;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }

  .rarity-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #fff;
  }

  .rarity-badge.SSR {
    background: #d4af37;
  }

  .rarity-badge.SR {
    background: #9333ea;
  }

  .rarity-badge.R {
    background: #2563eb;
  }

  .rarity-badge.N {
    background: #6b7280;
  }

  .item-table button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
    font-size: 0.85rem;
  }

  .item-table button:hover {
    background: var(--bg);
  }

  .item-pool-summary {
    margin-top: 12px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .sim-form {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 8px;
  }

  .sim-form input {
    width: 140px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
  }

  .sim-form button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    height: 38px;
  }

  .sim-form button:hover {
    background: var(--primary-dark);
  }

  .sim-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
  }

  .sim-card {
    flex: 1;
    min-width: 140px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }

  .sim-card .label {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .sim-card .value {
    font-size: 1.4rem;
    font-weight: 700;
    margin-top: 4px;
  }

  .sim-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
  }

  .sim-table th,
  .sim-table td {
    text-align: left;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }

  .sim-items-list {
    margin-top: 16px;
  }

  .sim-items-list ul {
    columns: 2;
    margin: 8px 0 0 0;
    padding-left: 20px;
  }

  .sim-items-list li {
    font-size: 0.9rem;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>Gacha Simulator</h1>
  <p>จำลองการสุ่มกาชา ตั้งค่าอัตราดรอป สร้างไอเทม และดูสถิติผลลัพธ์</p>
</header>

<main>
  <section id="rate-settings">
    <h2>ตั้งค่าอัตราดรอป (Rate Settings)</h2>
    <div class="rate-grid">
      <div class="rate-field">
        <label for="rate-ssr">SSR</label>
        <div class="rate-input-wrap">
          <input type="number" id="rate-ssr" data-rarity="SSR" value="1">
          <span class="unit">%</span>
        </div>
      </div>
      <div class="rate-field">
        <label for="rate-sr">SR</label>
        <div class="rate-input-wrap">
          <input type="number" id="rate-sr" data-rarity="SR" value="9">
          <span class="unit">%</span>
        </div>
      </div>
      <div class="rate-field">
        <label for="rate-r">R</label>
        <div class="rate-input-wrap">
          <input type="number" id="rate-r" data-rarity="R" value="30">
          <span class="unit">%</span>
        </div>
      </div>
      <div class="rate-field">
        <label for="rate-n">N</label>
        <div class="rate-input-wrap">
          <input type="number" id="rate-n" data-rarity="N" value="60">
          <span class="unit">%</span>
        </div>
      </div>
    </div>
    <div id="rate-total" class="rate-total"></div>
  </section>

  <section id="item-pool">
    <h2>คลังไอเทม (Item Pool)</h2>
    <div class="item-form">
      <input type="text" id="item-name-input" placeholder="ชื่อ item">
      <select id="item-rarity-input">
        <option value="">เลือก Rarity</option>
        <option value="SSR">SSR</option>
        <option value="SR">SR</option>
        <option value="R">R</option>
        <option value="N">N</option>
      </select>
      <button id="add-item-btn">+ Add Item</button>
    </div>
    <div id="item-form-error" class="form-error"></div>
    <table class="item-table">
      <thead>
        <tr>
          <th>ลำดับ</th>
          <th>ชื่อ item</th>
          <th>Rarity</th>
          <th>แก้ไข</th>
          <th>ลบ</th>
        </tr>
      </thead>
      <tbody id="item-table-body"></tbody>
    </table>
    <div id="item-empty" class="placeholder"></div>
    <div id="item-pool-summary" class="item-pool-summary"></div>
    <div id="item-pool-validation" class="rate-total"></div>
  </section>

  <section id="single-simulation">
    <h2>สุ่มเดี่ยว (Single Simulation)</h2>
    <div class="sim-form">
      <div class="rate-field">
        <label for="sim-roll-count">จำนวนครั้งที่สุ่ม</label>
        <input type="number" id="sim-roll-count" min="1" max="10000" step="1" value="100">
      </div>
      <div class="rate-field">
        <label for="sim-price">ราคาต่อครั้ง</label>
        <input type="number" id="sim-price" min="0" step="0.01" value="100">
      </div>
      <button id="run-sim-btn">Start Simulation</button>
    </div>
    <div id="sim-form-error" class="form-error"></div>
    <div id="sim-result"></div>
  </section>

  <section id="player-pov">
    <h2>มุมมองผู้เล่น (Player POV)</h2>
    <div class="placeholder"><!-- TODO: render player POV UI --></div>
  </section>

  <section id="history">
    <h2>ประวัติการสุ่ม (History)</h2>
    <div class="placeholder"><!-- TODO: render history UI --></div>
  </section>
</main>

<script>
  const state = {
    rates: { SSR: 1, SR: 9, R: 30, N: 60 },
    items: [
      { name: "Legendary Sword", rarity: "SSR" },
      { name: "Phoenix", rarity: "SSR" },
      { name: "Magic Staff", rarity: "SR" },
      { name: "Dragon Shield", rarity: "SR" },
      { name: "Iron Bow", rarity: "R" },
      { name: "Forest Cloak", rarity: "R" },
      { name: "HP Potion", rarity: "N" },
      { name: "Rope", rarity: "N" },
      { name: "Torch", rarity: "N" }
    ],
    simResult: null,
    povResult: null,
    history: []
  };

  // ตรวจสอบว่าผลรวมของ state.rates เท่ากับ 100 และค่าทุกตัวไม่ติดลบและเป็นตัวเลข
  function validateRates() {
    const keys = ["SSR", "SR", "R", "N"];
    for (const key of keys) {
      const value = state.rates[key];
      if (typeof value !== "number" || isNaN(value)) {
        return { valid: false, message: `ค่า ${key} ไม่ใช่ตัวเลข` };
      }
      if (value < 0) {
        return { valid: false, message: `ค่า ${key} ติดลบไม่ได้` };
      }
    }

    const total = keys.reduce((sum, key) => sum + state.rates[key], 0);
    if (total !== 100) {
      return { valid: false, message: `ผลรวมต้องเท่ากับ 100 (ตอนนี้รวมได้ ${total})` };
    }

    return { valid: true, message: "ผลรวม 100% ถูกต้อง" };
  }

  // อัปเดต state.rates เมื่อ user แก้ไข input แล้ว render ใหม่
  function handleRateInputChange(event) {
    const input = event.target;
    const rarity = input.dataset.rarity;
    state.rates[rarity] = parseFloat(input.value);
    renderRateSettings();
    renderItemPool();
  }

  // render ส่วน rate-settings: total และสถานะ valid/invalid
  function renderRateSettings() {
    const total = ["SSR", "SR", "R", "N"].reduce((sum, key) => {
      const value = state.rates[key];
      return sum + (typeof value === "number" && !isNaN(value) ? value : 0);
    }, 0);

    const result = validateRates();
    const totalEl = document.getElementById("rate-total");

    if (result.valid) {
      totalEl.textContent = `✓ รวม ${total}%`;
      totalEl.className = "rate-total valid";
    } else {
      totalEl.textContent = `✗ รวม ${total}% — ${result.message}`;
      totalEl.className = "rate-total invalid";
    }
  }

  // ตรวจสอบว่าทุก rarity ที่มี rate > 0 ต้องมี item อย่างน้อย 1 ชิ้นใน pool
  function validateItemPool() {
    const missing = ["SSR", "SR", "R", "N"].filter((rarity) => {
      const rate = state.rates[rarity];
      const hasItems = state.items.some((item) => item.rarity === rarity);
      return typeof rate === "number" && rate > 0 && !hasItems;
    });

    if (missing.length > 0) {
      return { valid: false, message: `Rarity ที่มี rate > 0 แต่ยังไม่มี item: ${missing.join(", ")}` };
    }

    return { valid: true, message: "Item pool ครบถ้วน" };
  }

  // เพิ่มไอเทมใหม่เข้า state.items หลังตรวจสอบความถูกต้องของ input
  function addItem() {
    const nameInput = document.getElementById("item-name-input");
    const rarityInput = document.getElementById("item-rarity-input");
    const errorEl = document.getElementById("item-form-error");

    const name = nameInput.value.trim();
    const rarity = rarityInput.value;

    if (!name) {
      errorEl.textContent = "กรุณากรอกชื่อ item";
      return;
    }
    if (!rarity) {
      errorEl.textContent = "กรุณาเลือก Rarity";
      return;
    }

    state.items.push({ name, rarity });
    errorEl.textContent = "";
    nameInput.value = "";
    rarityInput.value = "";
    renderItemPool();
  }

  // แก้ไขไอเทมที่มีอยู่ใน state.items โดยใช้ prompt()
  function editItem(index) {
    const item = state.items[index];

    const newName = prompt("ชื่อ item ใหม่:", item.name);
    if (newName === null) return;
    const trimmedName = newName.trim();
    if (!trimmedName) {
      alert("ชื่อ item ห้ามว่าง");
      return;
    }

    const newRarity = prompt("Rarity ใหม่ (SSR/SR/R/N):", item.rarity);
    if (newRarity === null) return;
    const upperRarity = newRarity.trim().toUpperCase();
    if (!["SSR", "SR", "R", "N"].includes(upperRarity)) {
      alert("Rarity ต้องเป็น SSR, SR, R หรือ N เท่านั้น");
      return;
    }

    item.name = trimmedName;
    item.rarity = upperRarity;
    renderItemPool();
  }

  // ลบไอเทมออกจาก state.items แล้ว re-render
  function deleteItem(index) {
    state.items.splice(index, 1);
    renderItemPool();
  }

  // render ส่วน item-pool: ตาราง, summary, validation
  function renderItemPool() {
    const tbody = document.getElementById("item-table-body");
    const emptyEl = document.getElementById("item-empty");
    const summaryEl = document.getElementById("item-pool-summary");
    const validationEl = document.getElementById("item-pool-validation");

    tbody.innerHTML = "";

    if (state.items.length === 0) {
      emptyEl.textContent = "ยังไม่มี item เพิ่ม item ด้านบนก่อนเริ่ม simulation";
    } else {
      emptyEl.textContent = "";
      state.items.forEach((item, index) => {
        const tr = document.createElement("tr");

        const idxTd = document.createElement("td");
        idxTd.textContent = index + 1;

        const nameTd = document.createElement("td");
        nameTd.textContent = item.name;

        const rarityTd = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = `rarity-badge ${item.rarity}`;
        badge.textContent = item.rarity;
        rarityTd.appendChild(badge);

        const editTd = document.createElement("td");
        const editBtn = document.createElement("button");
        editBtn.textContent = "แก้ไข";
        editBtn.addEventListener("click", () => editItem(index));
        editTd.appendChild(editBtn);

        const deleteTd = document.createElement("td");
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "ลบ";
        deleteBtn.addEventListener("click", () => deleteItem(index));
        deleteTd.appendChild(deleteBtn);

        tr.append(idxTd, nameTd, rarityTd, editTd, deleteTd);
        tbody.appendChild(tr);
      });
    }

    const counts = { SSR: 0, SR: 0, R: 0, N: 0 };
    state.items.forEach((item) => {
      counts[item.rarity] = (counts[item.rarity] || 0) + 1;
    });
    summaryEl.textContent = `SSR: ${counts.SSR} | SR: ${counts.SR} | R: ${counts.R} | N: ${counts.N}`;

    const result = validateItemPool();
    if (result.valid) {
      validationEl.textContent = `✓ ${result.message}`;
      validationEl.className = "rate-total valid";
    } else {
      validationEl.textContent = `✗ ${result.message}`;
      validationEl.className = "rate-total invalid";
    }
  }

  // สุ่มผลลัพธ์ 1 ครั้ง: เลือก rarity ตาม cumulative rate แล้วเลือก item จาก pool ของ rarity นั้น
  function rollOnce() {
    const rarityOrder = ["SSR", "SR", "R", "N"];
    const roll = Math.random();

    let cumulative = 0;
    let chosenRarity = rarityOrder[rarityOrder.length - 1];
    for (const rarity of rarityOrder) {
      cumulative += state.rates[rarity] / 100;
      if (roll < cumulative) {
        chosenRarity = rarity;
        break;
      }
    }

    const pool = state.items.filter((item) => item.rarity === chosenRarity);
    const itemIndex = Math.floor(Math.random() * pool.length);
    const itemName = pool[itemIndex].name;

    return { rarity: chosenRarity, itemName };
  }

  // รันการจำลองสุ่มหลายครั้ง คำนวณสถิติ แล้วเก็บลง state.simResult
  function runSimulation(rollCount, pricePerRoll) {
    const errorEl = document.getElementById("sim-form-error");
    errorEl.textContent = "";

    const ratesCheck = validateRates();
    if (!ratesCheck.valid) {
      errorEl.textContent = `ตั้งค่า Rate ไม่ถูกต้อง: ${ratesCheck.message}`;
      return;
    }

    const itemsCheck = validateItemPool();
    if (!itemsCheck.valid) {
      errorEl.textContent = `Item Pool ไม่ถูกต้อง: ${itemsCheck.message}`;
      return;
    }

    if (!Number.isInteger(rollCount) || rollCount <= 0 || rollCount > 10000) {
      errorEl.textContent = "จำนวนครั้งที่สุ่มต้องเป็นจำนวนเต็มมากกว่า 0 และไม่เกิน 10000";
      return;
    }

    if (typeof pricePerRoll !== "number" || isNaN(pricePerRoll) || pricePerRoll < 0) {
      errorEl.textContent = "ราคาต่อครั้งต้องเป็นตัวเลขที่ไม่ติดลบ";
      return;
    }

    const results = [];
    for (let i = 0; i < rollCount; i++) {
      results.push(rollOnce());
    }

    const counts = { SSR: 0, SR: 0, R: 0, N: 0 };
    const itemCounts = {};
    results.forEach((result) => {
      counts[result.rarity]++;
      const key = `${result.itemName}|${result.rarity}`;
      itemCounts[key] = (itemCounts[key] || 0) + 1;
    });

    const actualPercent = {};
    ["SSR", "SR", "R", "N"].forEach((rarity) => {
      actualPercent[rarity] = (counts[rarity] / rollCount) * 100;
    });

    const totalCost = rollCount * pricePerRoll;

    const mostCommonRarity = ["SSR", "SR", "R", "N"].reduce((best, rarity) =>
      counts[rarity] > counts[best] ? rarity : best
    );

    const rarityRank = { SSR: 0, SR: 1, R: 2, N: 3 };
    const itemList = Object.entries(itemCounts)
      .map(([key, count]) => {
        const [itemName, rarity] = key.split("|");
        return { itemName, rarity, count };
      })
      .sort((a, b) => {
        if (rarityRank[a.rarity] !== rarityRank[b.rarity]) {
          return rarityRank[a.rarity] - rarityRank[b.rarity];
        }
        return b.count - a.count;
      });

    state.simResult = {
      rollCount,
      pricePerRoll,
      totalCost,
      counts,
      actualPercent,
      mostCommonRarity,
      itemList
    };

    renderSimResult();
  }

  // TODO: รันการจำลองแบบ Monte Carlo จากมุมมองผู้เล่น เก็บผลลัพธ์ลง state.povResult

  // TODO: export ผลการสุ่มเป็น CSV ผ่าน Blob + URL.createObjectURL
  function exportPullCSV() {

  // TODO: export ผลลัพธ์ POV เป็น CSV ผ่าน Blob + URL.createObjectURL
  function exportPOVCSV() {

  // render ส่วน single-simulation: cards, ตารางสรุป, รายการ item
  function renderSimResult() {
    const container = document.getElementById("sim-result");

    if (!state.simResult) {
      container.innerHTML = '<div class="placeholder">กรอกจำนวนครั้งและราคา แล้วกด Start Simulation</div>';
      return;
    }

    const { rollCount, totalCost, counts, actualPercent, mostCommonRarity, itemList } = state.simResult;

    container.innerHTML = "";

    const cardsDiv = document.createElement("div");
    cardsDiv.className = "sim-cards";
    [
      { label: "Total Rolls", value: rollCount },
      { label: "Total Cost", value: totalCost.toLocaleString() },
      { label: "SSR Count", value: counts.SSR },
      { label: "Most Common Rarity", value: mostCommonRarity }
    ].forEach(({ label, value }) => {
      const card = document.createElement("div");
      card.className = "sim-card";
      card.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
      cardsDiv.appendChild(card);
    });
    container.appendChild(cardsDiv);

    const table = document.createElement("table");
    table.className = "sim-table";
    table.innerHTML = `
      <thead>
        <tr><th>Rarity</th><th>Rate ที่ตั้ง</th><th>จำนวนที่ได้</th><th>Actual%</th></tr>
      </thead>
    `;
    const tbody = document.createElement("tbody");
    ["SSR", "SR", "R", "N"].forEach((rarity) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="rarity-badge ${rarity}">${rarity}</span></td>
        <td>${state.rates[rarity]}%</td>
        <td>${counts[rarity]}</td>
        <td>${actualPercent[rarity].toFixed(2)}%</td>
      `;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    container.appendChild(table);

    const itemsDiv = document.createElement("div");
    itemsDiv.className = "sim-items-list";
    const ul = document.createElement("ul");
    itemList.forEach(({ itemName, rarity, count }) => {
      const li = document.createElement("li");
      li.textContent = `${itemName} x${count} (${rarity})`;
      ul.appendChild(li);
    });
    itemsDiv.innerHTML = "<strong>Item ที่ได้ทั้งหมด:</strong>";
    itemsDiv.appendChild(ul);
    container.appendChild(itemsDiv);
  }

  // TODO: render ทุก section ตามค่าปัจจุบันใน state
  function renderAll() {
    renderRateSettings();
    renderItemPool();
    renderSimResult();
  }

  document.querySelectorAll(".rate-input-wrap input").forEach((input) => {
    input.addEventListener("input", handleRateInputChange);
  });

  document.getElementById("add-item-btn").addEventListener("click", addItem);

  document.getElementById("run-sim-btn").addEventListener("click", () => {
    const rollCount = parseInt(document.getElementById("sim-roll-count").value, 10);
    const pricePerRoll = parseFloat(document.getElementById("sim-price").value);
    runSimulation(rollCount, pricePerRoll);
  });

  renderAll();
</script>

</body>
</html>
